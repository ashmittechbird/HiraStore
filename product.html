<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product – The Hira Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brand:#005969;--brand-dark:#003d4a;--brand-light:#007a8c;--brand-pale:#e0f2f4;
      --cream:#f8fbfc;--ivory:#f0f8f9;--white:#fff;
      --text:#334d52;--text-light:#6b8b91;
      --border:#c8e0e4;--border-soft:#ddeef1;
      --shadow:0 2px 24px rgba(0,26,32,.09);
      --gold:#c9a84c;
      --font-serif:'Cormorant Garamond',Georgia,serif;
      --font-display:'Playfair Display',Georgia,serif;
      --font-body:'DM Sans',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--cream);color:var(--text);min-height:100vh}

    /* NAV */
    .nav{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:var(--white);border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:100}
    .nav-logo{font-family:var(--font-display);font-size:1.35rem;color:var(--brand);text-decoration:none;letter-spacing:.02em}
    .nav-right{display:flex;align-items:center;gap:16px}
    .nav-link{font-size:13px;color:var(--text-light);text-decoration:none;transition:color .2s}
    .nav-link:hover{color:var(--brand)}
    .cart-btn{position:relative;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light);text-decoration:none;transition:color .2s;padding:6px 12px;border:1px solid var(--border);border-radius:6px}
    .cart-btn:hover{color:var(--brand);border-color:var(--brand)}
    .cart-badge{position:absolute;top:-6px;right:-6px;background:var(--brand);color:#fff;font-size:10px;font-weight:600;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}

    /* BREADCRUMB */
    .breadcrumb{max-width:1100px;margin:0 auto;padding:16px 24px 0;font-size:12px;color:var(--text-light);display:flex;align-items:center;gap:6px}
    .breadcrumb a{color:var(--text-light);text-decoration:none;transition:color .2s}
    .breadcrumb a:hover{color:var(--brand)}
    .breadcrumb span{color:var(--text)}

    /* PRODUCT LAYOUT */
    .product-wrap{max-width:1100px;margin:0 auto;padding:32px 24px 64px;display:grid;grid-template-columns:1fr 480px;gap:48px;align-items:start}
    @media(max-width:860px){.product-wrap{grid-template-columns:1fr;gap:32px;padding:24px 16px 48px}}

    /* IMAGE GALLERY */
    .gallery{position:sticky;top:80px}
    .main-img-wrap{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--ivory);border:1px solid var(--border-soft);margin-bottom:12px}
    .main-img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
    .main-img:hover{transform:scale(1.03)}
    .main-img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:14px}
    .thumb-row{display:flex;gap:8px;flex-wrap:wrap}
    .thumb{width:72px;height:72px;border-radius:8px;border:2px solid transparent;overflow:hidden;cursor:pointer;background:var(--ivory);transition:border-color .2s}
    .thumb.active,.thumb:hover{border-color:var(--brand)}
    .thumb img{width:100%;height:100%;object-fit:cover}

    /* PRODUCT INFO */
    .product-info{}
    .product-badge-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
    .badge-cat{background:var(--brand-pale);color:var(--brand)}
    .badge-featured{background:#fef9ec;color:var(--gold);border:1px solid #f5e4a8}
    .product-name{font-family:var(--font-display);font-size:2rem;font-weight:400;color:var(--brand);line-height:1.25;margin-bottom:12px}
    .product-price{font-family:var(--font-serif);font-size:2rem;color:var(--brand);font-weight:500;margin-bottom:20px}
    .product-price .orig{font-size:1.1rem;color:var(--text-light);text-decoration:line-through;margin-left:8px}

    .divider{height:1px;background:var(--border-soft);margin:20px 0}

    .detail-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;font-size:14px}
    .detail-label{font-weight:500;color:var(--text-light);min-width:80px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:1px}
    .detail-val{color:var(--text);line-height:1.5}

    .product-desc{font-size:14px;color:var(--text-light);line-height:1.7;margin-bottom:24px}

    /* QTY + ADD */
    .qty-row{display:flex;align-items:center;gap:16px;margin-bottom:16px}
    .qty-label{font-size:12px;font-weight:500;color:var(--text-light);text-transform:uppercase;letter-spacing:.05em}
    .qty-ctrl{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:6px;overflow:hidden}
    .qty-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--text-light);font-size:18px;transition:background .15s;font-family:var(--font-body)}
    .qty-btn:hover{background:var(--ivory);color:var(--brand)}
    .qty-num{width:40px;text-align:center;font-size:14px;font-weight:500;color:var(--text);border:none;background:none;outline:none}

    .btn-add{width:100%;padding:15px 24px;background:var(--brand);color:#fff;font-family:var(--font-body);font-size:15px;font-weight:500;border:none;border-radius:8px;cursor:pointer;letter-spacing:.03em;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
    .btn-add:hover{background:var(--brand-dark)}
    .btn-add:active{transform:scale(.99)}
    .btn-add.added{background:#16a34a}
    .btn-wish{width:100%;padding:12px 24px;background:transparent;color:var(--text);font-family:var(--font-body);font-size:14px;font-weight:400;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;letter-spacing:.02em;transition:border-color .2s,color .2s,background .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-wish:hover{border-color:var(--brand);color:var(--brand);background:var(--ivory)}
    .btn-wish.wishlisted{border-color:var(--brand);color:var(--brand);background:var(--brand-pale)}

    /* TRUST */
    .trust-row{display:flex;flex-direction:column;gap:10px;margin-top:20px;padding:16px;background:var(--ivory);border-radius:8px;border:1px solid var(--border-soft)}
    .trust-item{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-light)}
    .trust-item svg{width:16px;height:16px;color:var(--brand);flex-shrink:0}

    /* TOAST */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--brand);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* SKELETON */
    .skel{background:linear-gradient(90deg,var(--border-soft) 25%,var(--ivory) 50%,var(--border-soft) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">The Hira Store</a>
  <div class="nav-right">
    <a href="shop.html" class="nav-link">Shop</a>
    <a href="account.html" class="nav-link" id="accountLink">Account</a>
    <a href="cart.html" class="cart-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/></svg>
      Cart
      <span class="cart-badge" id="cartBadge" style="display:none"></span>
    </a>
  </div>
</nav>

<div class="breadcrumb">
  <a href="index.html">Home</a> ›
  <a href="shop.html">Shop</a> ›
  <span id="bcName">Loading…</span>
</div>

<div class="product-wrap">
  <!-- GALLERY -->
  <div class="gallery">
    <div class="main-img-wrap" id="mainImgWrap">
      <div class="main-img-placeholder skel" style="height:100%"></div>
    </div>
    <div class="thumb-row" id="thumbRow"></div>
  </div>

  <!-- INFO -->
  <div class="product-info">
    <div class="product-badge-row" id="badgeRow"></div>
    <h1 class="product-name" id="productName">
      <span class="skel" style="display:block;height:2.5rem;width:80%"></span>
    </h1>
    <div class="product-price" id="productPrice">
      <span class="skel" style="display:inline-block;height:2rem;width:120px"></span>
    </div>

    <div class="product-desc" id="productDesc"></div>

    <div id="detailRows"></div>

    <div class="divider"></div>

    <div class="qty-row">
      <span class="qty-label">Qty</span>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <input class="qty-num" id="qtyNum" type="number" value="1" min="1" max="10" readonly/>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>

    <button class="btn-add" id="addBtn" onclick="addToCart()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/></svg>
      Add to Cart
    </button>
    <button class="btn-wish" id="wishBtn" onclick="toggleWishlist()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      <span id="wishText">Save to Wishlist</span>
    </button>

    <div class="trust-row">
      <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>925 Sterling Silver — BIS certified & hallmarked</div>
      <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Free worldwide shipping on orders over $50</div>
      <div class="trust-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>30-day hassle-free returns</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ─── Load product from URL param or sessionStorage ────────────────────────
  const params  = new URLSearchParams(window.location.search);
  const prodId  = params.get('id');

  let product = null;

  // Try sessionStorage first (passed from shop quick-view)
  const stored = sessionStorage.getItem('hs_product_view');
  if (stored) {
    try { product = JSON.parse(stored); } catch(e) {}
    sessionStorage.removeItem('hs_product_view');
  }

  // ─── INIT ─────────────────────────────────────────────────────────────────
  async function init() {
    updateCartBadge();
    const token = localStorage.getItem('hs_session_token');
    document.getElementById('accountLink').href = token ? 'account.html' : 'login.html';

    if (product) {
      renderProduct(product);
    } else if (prodId) {
      await fetchProduct(prodId);
    } else {
      window.location.href = 'shop.html';
    }
  }

  async function fetchProduct(id) {
    try {
      const fields = encodeURIComponent(JSON.stringify([
        "name","item_name","item_group","standard_rate","image",
        "weight_per_unit","custom_material","custom_is_featured",
        "custom_short_description","description"
      ]));
      const res  = await fetch(`/erp/api/resource/Item/${encodeURIComponent(id)}?fields=${fields}`);
      const data = await res.json();
      if (!data.data) throw new Error('Not found');
      const d = data.data;
      renderProduct({
        product_id: d.name,
        name:       d.item_name || d.name,
        category:   d.item_group || '',
        price:      d.standard_rate || 0,
        currency:   '$',
        image:      d.image ? (d.image.startsWith('/') ? '/erp' + d.image : d.image) : '',
        weight:     d.weight_per_unit ? d.weight_per_unit + 'g' : '',
        material:   d.custom_material || '',
        featured:   !!d.custom_is_featured,
        description: d.description || d.custom_short_description || '',
      });
    } catch(e) {
      document.querySelector('.product-wrap').innerHTML = '<div style="padding:48px;text-align:center;color:var(--text-light)">Product not found. <a href="shop.html" style="color:var(--brand)">Back to shop</a></div>';
    }
  }

  function renderProduct(p) {
    product = p;
    document.title = p.name + ' – The Hira Store';
    document.getElementById('bcName').textContent = p.name;

    // Badges
    const badgeRow = document.getElementById('badgeRow');
    badgeRow.innerHTML = (p.category ? `<span class="badge badge-cat">${p.category}</span>` : '') +
                         (p.featured  ? `<span class="badge badge-featured">Featured</span>` : '');

    // Name + price
    document.getElementById('productName').textContent  = p.name;
    document.getElementById('productPrice').textContent = (p.currency || '$') + Number(p.price).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

    // Description
    if (p.description) {
      const desc = document.getElementById('productDesc');
      desc.innerHTML = p.description;
    }

    // Detail rows
    const rows = [];
    if (p.material) rows.push(['Material', p.material]);
    if (p.weight)   rows.push(['Weight', p.weight]);
    if (p.category) rows.push(['Category', p.category]);
    document.getElementById('detailRows').innerHTML = rows.map(([l,v]) =>
      `<div class="detail-row"><span class="detail-label">${l}</span><span class="detail-val">${v}</span></div>`
    ).join('');

    // Image
    const wrap = document.getElementById('mainImgWrap');
    if (p.image) {
      wrap.innerHTML = `<img class="main-img" src="${p.image}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=700&q=85'"/>`;
    } else {
      wrap.innerHTML = `<div class="main-img-placeholder">No image</div>`;
    }

    // Wishlist state
    updateWishBtn();
  }

  // ─── QTY ──────────────────────────────────────────────────────────────────
  function changeQty(delta) {
    const el  = document.getElementById('qtyNum');
    const val = Math.min(10, Math.max(1, parseInt(el.value) + delta));
    el.value  = val;
  }

  // ─── CART ─────────────────────────────────────────────────────────────────
  function addToCart() {
    if (!product) return;
    const qty  = parseInt(document.getElementById('qtyNum').value) || 1;
    const cart = JSON.parse(localStorage.getItem('hirastore_cart') || '[]');
    const existing = cart.find(c => c.id === product.product_id);
    if (existing) {
      existing.qty = Math.min(10, existing.qty + qty);
    } else {
      cart.push({
        id:       product.product_id,
        name:     product.name,
        category: product.category,
        price:    product.price,
        price_usd:product.price,
        image:    product.image,
        qty,
      });
    }
    localStorage.setItem('hirastore_cart', JSON.stringify(cart));
    updateCartBadge();

    const btn = document.getElementById('addBtn');
    btn.classList.add('added');
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Added to Cart';
    setTimeout(() => {
      btn.classList.remove('added');
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/></svg> Add to Cart';
    }, 2000);
    showToast('Added to cart!');
  }

  function updateCartBadge() {
    const cart  = JSON.parse(localStorage.getItem('hirastore_cart') || '[]');
    const total = cart.reduce((s, c) => s + (c.qty || 1), 0);
    const badge = document.getElementById('cartBadge');
    if (total > 0) { badge.textContent = total; badge.style.display = 'flex'; }
    else badge.style.display = 'none';
  }

  // ─── WISHLIST ─────────────────────────────────────────────────────────────
  function getWishlist() {
    try { return JSON.parse(localStorage.getItem('hs_wishlist') || '[]'); } catch(e) { return []; }
  }
  function toggleWishlist() {
    if (!product) return;
    const list = getWishlist();
    const idx  = list.findIndex(x => x.id === product.product_id);
    if (idx >= 0) {
      list.splice(idx, 1);
      showToast('Removed from wishlist');
    } else {
      list.push({ id: product.product_id, name: product.name, price: product.price, image: product.image, category: product.category });
      showToast('Saved to wishlist!');
    }
    localStorage.setItem('hs_wishlist', JSON.stringify(list));
    updateWishBtn();
  }
  function updateWishBtn() {
    if (!product) return;
    const inList = getWishlist().some(x => x.id === product.product_id);
    const btn    = document.getElementById('wishBtn');
    const txt    = document.getElementById('wishText');
    btn.classList.toggle('wishlisted', inList);
    txt.textContent = inList ? 'Saved to Wishlist' : 'Save to Wishlist';
  }

  // ─── TOAST ────────────────────────────────────────────────────────────────
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2400);
  }

  init();
</script>
</body>
</html>
