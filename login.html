<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – The Hira Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brand:#005969;--brand-dark:#003d4a;--brand-light:#007a8c;--brand-pale:#e0f2f4;
      --cream:#f8fbfc;--ivory:#f0f8f9;--white:#fff;
      --text:#334d52;--text-light:#6b8b91;
      --border:#c8e0e4;--border-soft:#ddeef1;
      --shadow:0 2px 24px rgba(0,26,32,.09);
      --font-serif:'Cormorant Garamond',Georgia,serif;
      --font-display:'Playfair Display',Georgia,serif;
      --font-body:'DM Sans',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--cream);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

    .nav{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:var(--white);border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:100}
    .nav-logo{text-decoration:none;display:flex;align-items:center}.nav-logo img{height:48px;width:auto;filter:contrast(1.2)}
    .nav-back{font-size:13px;color:var(--text-light);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .2s}
    .nav-back:hover{color:var(--brand)}
    .nav-back svg{width:16px;height:16px}

    .page-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}

    .auth-card{background:var(--white);border-radius:12px;border:1px solid var(--border-soft);box-shadow:var(--shadow);width:100%;max-width:420px;overflow:hidden}

    .auth-head{padding:36px 36px 28px;border-bottom:1px solid var(--border-soft);text-align:center}
    .auth-logo{font-family:var(--font-display);font-size:1.6rem;color:var(--brand);margin-bottom:6px}
    .auth-head h1{font-family:var(--font-display);font-size:1.4rem;font-weight:400;color:var(--brand);margin-bottom:4px}
    .auth-head p{font-size:13px;color:var(--text-light)}

    .auth-body{padding:28px 36px 32px}

    .field{margin-bottom:20px}
    .field label{display:block;font-size:12px;font-weight:500;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
    .field input{
      width:100%;padding:11px 14px;
      border:1.5px solid var(--border);border-radius:6px;
      font-family:var(--font-body);font-size:14px;color:var(--text);
      background:var(--white);transition:border-color .2s,box-shadow .2s;outline:none;
    }
    .field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,89,105,.08)}
    .field input::placeholder{color:var(--text-light);font-size:13px}

    .btn-primary{
      width:100%;padding:13px 24px;
      background:var(--brand);color:#fff;
      font-family:var(--font-body);font-size:14px;font-weight:500;
      border:none;border-radius:6px;cursor:pointer;
      letter-spacing:.03em;transition:background .2s;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-primary:hover:not(:disabled){background:var(--brand-dark)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    .btn-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    .auth-error{
      background:#fff1f1;border:1px solid #fca5a5;border-radius:6px;
      padding:10px 14px;font-size:13px;color:#c0392b;margin-bottom:18px;display:none;
    }

    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-light);font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

    .auth-footer{padding:0 36px 28px;text-align:center;font-size:13px;color:var(--text-light)}
    .auth-footer a{color:var(--brand);text-decoration:none;font-weight:500}
    .auth-footer a:hover{text-decoration:underline}

    .guest-btn{
      width:100%;padding:11px 24px;
      background:transparent;color:var(--text);
      font-family:var(--font-body);font-size:13px;font-weight:400;
      border:1.5px solid var(--border);border-radius:6px;cursor:pointer;
      transition:border-color .2s,background .2s;
    }
    .guest-btn:hover{border-color:var(--brand);background:var(--ivory)}

    .success-state{text-align:center;padding:20px 0}
    .success-icon{width:56px;height:56px;border-radius:50%;background:var(--brand-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
    .success-icon svg{width:28px;height:28px;color:var(--brand)}
    .success-state h2{font-family:var(--font-display);font-size:1.3rem;color:var(--brand);margin-bottom:6px}
    .success-state p{font-size:13px;color:var(--text-light)}
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo"><img src="https://wearparts.norework.in/wp-content/uploads/2023/09/Hira-1.png" alt="The Hira Store" /></a>
  <a href="index.html" class="nav-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Home
  </a>
</nav>

<div class="page-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">The Hira Store</div>
      <h1>Welcome Back</h1>
      <p>Sign in to your account to view orders & save your details</p>
    </div>

    <div class="auth-body">
      <div class="auth-error" id="authError"></div>

      <div id="loginForm">
        <div class="field">
          <label for="emailInput">Email Address</label>
          <input type="email" id="emailInput" placeholder="priya@example.com" autocomplete="email"/>
        </div>
        <div class="field">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="Your password" autocomplete="current-password"/>
        </div>

        <button class="btn-primary" id="loginBtn" onclick="doLogin()">
          <div class="btn-spin" id="btnSpin"></div>
          <span id="btnText">Sign In</span>
        </button>

        <div class="divider">or</div>

        <button class="guest-btn" onclick="continueAsGuest()">Continue as Guest</button>
      </div>

      <div id="successState" class="success-state" style="display:none">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2>Signed In!</h2>
        <p id="successMsg">Redirecting…</p>
      </div>
    </div>

    <div class="auth-footer">
      <p>New to The Hira Store? <a href="signup.html">Create an account</a></p>
      <p style="margin-top:8px"><a href="shop.html">Browse Shop</a></p>
    </div>
  </div>
</div>

<script>
  // If already logged in, redirect
  (function() {
    const token = localStorage.getItem('hs_session_token');
    if (token) {
      fetch('/api/auth/me', { headers: { 'X-Session-Token': token } })
        .then(r => r.json())
        .then(d => { if (d.email) window.location.href = returnUrl(); })
        .catch(() => {});
    }
  })();

  function returnUrl() {
    const p = new URLSearchParams(window.location.search);
    return p.get('return') || 'account.html';
  }

  async function doLogin() {
    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const errEl    = document.getElementById('authError');
    const btn      = document.getElementById('loginBtn');
    const spin     = document.getElementById('btnSpin');
    const txt      = document.getElementById('btnText');

    errEl.style.display = 'none';
    if (!email || !password) { showError('Please enter your email and password.'); return; }

    btn.disabled = true; spin.style.display = 'block'; txt.textContent = 'Signing in…';

    try {
      const res  = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) { throw new Error(data.error || 'Login failed'); }

      localStorage.setItem('hs_session_token', data.token);
      localStorage.setItem('hs_user_email',    data.email);
      localStorage.setItem('hs_user_name',     data.fullName);

      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('successState').style.display = 'block';
      document.getElementById('successMsg').textContent = 'Welcome, ' + data.fullName + '!';

      setTimeout(() => window.location.href = returnUrl(), 1200);
    } catch (e) {
      showError(e.message);
      btn.disabled = false; spin.style.display = 'none'; txt.textContent = 'Sign In';
    }
  }

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function continueAsGuest() {
    const p = new URLSearchParams(window.location.search);
    window.location.href = p.get('return') || 'checkout.html';
  }

  // Enter key submits
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
