<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wishlist | The Hira Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --gold:#005969;--gold-dark:#003d4a;--gold-light:#007a8c;
      --bg:#ffffff;--text:#555555;--text-dark:#2c2c2c;--text-light:#888888;
      --border:#e8e0d8;--surface:#faf8f5;
      --font-body:'Poppins',sans-serif;--font-head:'Nunito',sans-serif;
      --ease-out:cubic-bezier(0.22,1,0.36,1);
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);color:var(--text);background:var(--bg);font-size:15px;line-height:1.65}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;border:none;background:none;font-family:inherit}

    /* NAV */
    .nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:72px}
    .nav-left,.nav-right{flex:1;display:flex;align-items:center}
    .nav-right{justify-content:flex-end;gap:20px}
    .nav-center{flex:0 0 auto}
    .nav-logo img{height:48px;width:auto;filter:contrast(1.2)}
    .nav-links{display:flex;gap:32px;list-style:none}
    .nav-links a{font-size:12px;font-weight:500;color:var(--text-dark);text-transform:uppercase;letter-spacing:0.05em;transition:color 0.3s}
    .nav-links a:hover{color:var(--gold)}
    .nav-icon{display:flex;align-items:center;justify-content:center;width:40px;height:40px;color:var(--text-dark);transition:transform 0.2s var(--ease-out);position:relative}
    .nav-icon:hover{transform:scale(1.1);color:var(--gold)}
    .nav-icon svg{width:20px;height:20px;stroke-width:1.5;fill:none;stroke:currentColor}
    .cart-wrap{position:relative}
    .cart-badge{position:absolute;top:6px;right:4px;background:var(--gold);color:#fff;font-size:9px;font-weight:600;width:14px;height:14px;display:flex;align-items:center;justify-content:center;border-radius:50%}

    /* PAGE HEADER */
    .page-header{padding:48px 48px 32px;max-width:1296px;margin:0 auto}
    .breadcrumb{font-size:12px;color:var(--text-light);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .breadcrumb a:hover{color:var(--gold)}
    .page-title{font-family:var(--font-head);font-size:clamp(28px,4vw,42px);font-weight:800;color:var(--text-dark);line-height:1.1}
    .page-subtitle{font-size:14px;color:var(--text-light);margin-top:8px}

    /* GRID */
    .wishlist-container{max-width:1296px;margin:0 auto;padding:0 48px 80px}
    .wishlist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}

    /* CARD */
    .wish-card{background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:box-shadow 0.3s var(--ease-out)}
    .wish-card:hover{box-shadow:0 12px 40px rgba(0,0,0,0.1)}
    .wish-img-wrap{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--surface)}
    .wish-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s var(--ease-out)}
    .wish-card:hover .wish-img-wrap img{transform:scale(1.05)}
    .wish-remove{position:absolute;top:10px;right:10px;width:32px;height:32px;background:rgba(255,255,255,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background 0.2s;z-index:2}
    .wish-remove:hover{background:#fff}
    .wish-remove svg{width:14px;height:14px;fill:none;stroke:#e04040;stroke-width:2}
    .wish-info{padding:16px}
    .wish-name{font-family:var(--font-head);font-size:15px;font-weight:700;color:var(--text-dark);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wish-cat{font-size:12px;color:var(--text-light);margin-bottom:10px}
    .wish-price{font-size:16px;font-weight:600;color:var(--text-dark);margin-bottom:14px}
    .wish-actions{display:flex;gap:8px}
    .btn-add-cart{flex:1;padding:10px;background:var(--gold);color:#fff;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;transition:background 0.2s}
    .btn-add-cart:hover{background:var(--gold-dark)}
    .btn-add-cart.added{background:#2eaa6e}
    .btn-view{padding:10px 14px;border:1.5px solid var(--border);color:var(--text-dark);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;transition:border-color 0.2s,color 0.2s}
    .btn-view:hover{border-color:var(--gold);color:var(--gold)}

    /* EMPTY STATE */
    .empty-state{text-align:center;padding:80px 20px}
    .empty-icon{font-size:56px;margin-bottom:20px;opacity:0.3}
    .empty-state h2{font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--text-dark);margin-bottom:10px}
    .empty-state p{color:var(--text-light);margin-bottom:28px;font-size:14px}
    .btn-shop{display:inline-flex;align-items:center;gap:8px;padding:13px 32px;background:var(--gold);color:#fff;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;border-radius:3px;transition:background 0.2s}
    .btn-shop:hover{background:var(--gold-dark)}

    /* TOAST */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:all 0.3s;z-index:9999;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* HAMBURGER + MOBILE NAV */
    .hamburger{display:none;width:40px;height:40px;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding:0}
    .hamburger svg{width:22px;height:22px;stroke:var(--text-dark);stroke-width:1.8;fill:none}
    .mob-nav{position:fixed;inset:0;z-index:500;pointer-events:none}
    .mob-nav.open{pointer-events:auto}
    .mob-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s}
    .mob-nav.open .mob-overlay{opacity:1}
    .mob-panel{position:absolute;top:0;left:0;bottom:0;width:260px;background:#fff;transform:translateX(-100%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding:0;box-shadow:4px 0 24px rgba(0,0,0,.1)}
    .mob-nav.open .mob-panel{transform:none}
    .mob-head{display:flex;justify-content:space-between;align-items:center;padding:20px 16px;border-bottom:1px solid var(--border)}
    .mob-head img{height:24px}
    .mob-close-btn{background:none;border:none;cursor:pointer;padding:4px}
    .mob-close-btn svg{width:20px;height:20px;stroke:var(--text-dark);stroke-width:1.8;fill:none}
    .mob-nav-links{list-style:none;padding:16px 0}
    .mob-nav-links li a{display:block;padding:13px 24px;font-size:14px;color:var(--text-dark);text-transform:uppercase;letter-spacing:.04em;font-weight:500;border-bottom:1px solid var(--surface);text-decoration:none;transition:background .15s}
    .mob-nav-links li a:hover{background:var(--surface);color:var(--gold)}

    /* RESPONSIVE */
    @media(max-width:1024px){.wishlist-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:768px){
      .nav{padding:0 16px}
      .nav-links{display:none}
      .hamburger{display:flex}
      .page-header{padding:32px 16px 20px}
      .wishlist-container{padding:0 16px 60px}
      .wishlist-grid{grid-template-columns:repeat(2,1fr);gap:16px}
    }
    @media(max-width:480px){.wishlist-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
  </style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-left">
    <button class="hamburger" id="wlHamburger" aria-label="Menu">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <ul class="nav-links">
      <li><a href="/shop">Shop All</a></li>
      <li><a href="/shop?cat=Necklaces">Necklaces</a></li>
      <li><a href="/shop?cat=Earrings">Earrings</a></li>
      <li><a href="/shop?cat=Rings">Rings</a></li>
    </ul>
  </div>
  <a href="/" class="nav-center nav-logo">
    <img src="https://wearparts.norework.in/wp-content/uploads/2023/09/Hira-1.png" alt="The Hira Store"/>
  </a>
  <div class="nav-right">
    <a href="/login" class="nav-icon" id="accountNavBtn" aria-label="Account">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <div class="cart-wrap">
      <a href="/wishlist" class="nav-icon" aria-label="Wishlist" style="color:var(--gold)">
        <svg viewBox="0 0 24 24" style="fill:var(--gold);stroke:var(--gold)"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      </a>
      <span class="cart-badge" id="wishBadge" style="display:none"></span>
    </div>
    <div class="cart-wrap">
      <a href="/cart" class="nav-icon" aria-label="Cart">
        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </a>
      <span class="cart-badge" id="cartBadge" style="display:none"></span>
    </div>
  </div>
</nav>
<!-- Mobile Nav Drawer -->
<div class="mob-nav" id="wlMobNav">
  <div class="mob-overlay" id="wlOverlay"></div>
  <div class="mob-panel">
    <div class="mob-head">
      <img src="https://wearparts.norework.in/wp-content/uploads/2023/09/Hira-1.png" alt="Hira"/>
      <button class="mob-close-btn" id="wlClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <ul class="mob-nav-links">
      <li><a href="/shop">Shop All</a></li>
      <li><a href="/shop?cat=Necklaces">Necklaces</a></li>
      <li><a href="/shop?cat=Earrings">Earrings</a></li>
      <li><a href="/shop?cat=Rings">Rings</a></li>
      <li><a href="/wishlist">Wishlist</a></li>
    </ul>
  </div>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <nav class="breadcrumb">
    <a href="/">Home</a>
    <span>›</span>
    <span>Wishlist</span>
  </nav>
  <h1 class="page-title">My Wishlist</h1>
  <p class="page-subtitle" id="pageSubtitle">Loading…</p>
</div>

<!-- WISHLIST CONTENT -->
<div class="wishlist-container">
  <div id="wishlistGrid" class="wishlist-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <div class="empty-icon">♡</div>
    <h2>Your wishlist is empty</h2>
    <p>Save items you love by clicking the heart icon while browsing.</p>
    <a href="/shop" class="btn-shop">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      Start Shopping
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ── HELPERS ──────────────────────────────────────── */
  function getWishlist() {
    try { return JSON.parse(localStorage.getItem('hs_wishlist') || '[]'); } catch(e) { return []; }
  }
  function saveWishlist(list) {
    localStorage.setItem('hs_wishlist', JSON.stringify(list));
  }
  function getCart() {
    try { return JSON.parse(localStorage.getItem('hirastore_cart') || '[]'); } catch(e) { return []; }
  }
  function saveCart(cart) {
    localStorage.setItem('hirastore_cart', JSON.stringify(cart));
  }
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ── BADGES ───────────────────────────────────────── */
  function updateBadges() {
    const wCount = getWishlist().length;
    const wb = document.getElementById('wishBadge');
    if (wb) { wb.textContent = wCount || ''; wb.style.display = wCount > 0 ? 'flex' : 'none'; }

    const cart  = getCart();
    const total = cart.reduce((s, c) => s + (c.qty || 1), 0);
    const cb = document.getElementById('cartBadge');
    if (cb) { cb.textContent = total || ''; cb.style.display = total > 0 ? 'flex' : 'none'; }
  }

  /* ── RENDER ───────────────────────────────────────── */
  function render() {
    const list     = getWishlist();
    const grid     = document.getElementById('wishlistGrid');
    const empty    = document.getElementById('emptyState');
    const subtitle = document.getElementById('pageSubtitle');

    updateBadges();

    if (list.length === 0) {
      grid.style.display  = 'none';
      empty.style.display = '';
      subtitle.textContent = '0 saved items';
      return;
    }

    grid.style.display  = '';
    empty.style.display = 'none';
    subtitle.textContent = list.length + ' saved item' + (list.length !== 1 ? 's' : '');

    grid.innerHTML = list.map((item, i) => {
      const price = item.price > 0
        ? (item.currency || '$') + Number(item.price).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})
        : 'Price on request';
      const imgSrc = item.image || '';
      return `
        <div class="wish-card" data-id="${item.id}">
          <div class="wish-img-wrap">
            ${imgSrc
              ? `<img src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=400&q=80'"/>`
              : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:13px">No image</div>`
            }
            <button class="wish-remove" data-remove="${item.id}" aria-label="Remove from wishlist">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="wish-info">
            <div class="wish-name">${item.name}</div>
            <div class="wish-cat">${item.category || ''}</div>
            <div class="wish-price">${price}</div>
            <div class="wish-actions">
              <button class="btn-add-cart" data-cart="${item.id}">Add to Cart</button>
              <a href="/product?id=${encodeURIComponent(item.id)}" class="btn-view">View</a>
            </div>
          </div>
        </div>`;
    }).join('');

    // Bind remove buttons
    grid.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id   = btn.dataset.remove;
        const list = getWishlist().filter(x => x.id !== id);
        saveWishlist(list);
        showToast('Removed from wishlist');
        render();
      });
    });

    // Bind add-to-cart buttons
    grid.querySelectorAll('[data-cart]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.adding) return;
        btn.dataset.adding = '1';
        const id   = btn.dataset.cart;
        const item = getWishlist().find(x => x.id === id);
        if (!item) return;
        const cart     = getCart();
        const existing = cart.find(c => c.id === id);
        if (existing) {
          existing.qty = Math.min(10, (existing.qty || 1) + 1);
        } else {
          cart.push({ id: item.id, name: item.name, category: item.category, price: item.price, price_usd: item.price, currency: item.currency, image: item.image, qty: 1 });
        }
        saveCart(cart);
        updateBadges();

        const orig = btn.textContent;
        btn.textContent = 'Added ✓';
        btn.classList.add('added');
        showToast('Added to cart!');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('added'); delete btn.dataset.adding; }, 1800);
      });
    });
  }

  /* ── ACCOUNT LINK ─────────────────────────────────── */
  (function() {
    const btn = document.getElementById('accountNavBtn');
    if (btn) btn.href = localStorage.getItem('hs_session_token') ? '/account' : '/login';
  })();

  render();

  // Mobile nav
  (function(){
    var h=document.getElementById('wlHamburger'),d=document.getElementById('wlMobNav'),c=document.getElementById('wlClose'),o=document.getElementById('wlOverlay');
    function open(){d.classList.add('open');document.body.style.overflow='hidden';}
    function close(){d.classList.remove('open');document.body.style.overflow='';}
    if(h)h.addEventListener('click',open);
    if(c)c.addEventListener('click',close);
    if(o)o.addEventListener('click',close);
  })();
</script>
</body>
</html>
