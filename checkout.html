<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout – The Hira Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --brand:#005969;--brand-dark:#003d4a;--brand-light:#007a8c;
      --cream:#f8fbfc;--ivory:#f0f8f9;--white:#fff;
      --text:#334d52;--text-light:#6b8b91;
      --border:#c8e0e4;--border-soft:#ddeef1;
      --shadow:0 2px 24px rgba(0,26,32,.09);
      --ease:cubic-bezier(0.22,1,0.36,1);
      --font-serif:'Cormorant Garamond',Georgia,serif;
      --font-display:'Playfair Display',Georgia,serif;
      --font-body:'DM Sans',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--cream);color:var(--text);min-height:100vh}

    /* NAV */
    .nav{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:var(--white);border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:100}
    .nav-logo{text-decoration:none;display:flex;align-items:center}.nav-logo img{height:48px;width:auto;filter:contrast(1.2)}
    .nav-back{font-size:13px;color:var(--text-light);text-decoration:none;display:flex;align-items:center;gap:6px;transition:color .2s}
    .nav-back:hover{color:var(--brand)}
    .nav-back svg{width:16px;height:16px}

    /* STEPS */
    .steps{display:flex;justify-content:center;gap:0;padding:28px 0 8px;background:var(--white);border-bottom:1px solid var(--border-soft)}
    .step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-light);padding:0 20px}
    .step.active{color:var(--brand);font-weight:500}
    .step.done{color:var(--brand-light)}
    .step-num{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
    .step.active .step-num{background:var(--brand);border-color:var(--brand);color:#fff}
    .step-div{width:40px;height:1px;background:var(--border);flex-shrink:0}

    /* LAYOUT */
    .page-wrap{max-width:1040px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start}
    @media(max-width:768px){.page-wrap{grid-template-columns:1fr;padding:24px 16px}.order-col{order:-1}}

    /* FORM CARD */
    .card{background:var(--white);border-radius:10px;border:1px solid var(--border-soft);box-shadow:var(--shadow)}
    .card-head{padding:24px 28px 20px;border-bottom:1px solid var(--border-soft)}
    .card-head h2{font-family:var(--font-display);font-size:1.4rem;color:var(--brand);font-weight:400}
    .card-head p{font-size:13px;color:var(--text-light);margin-top:4px}
    .card-body{padding:24px 28px}

    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:480px){.field-row{grid-template-columns:1fr}}
    .field{margin-bottom:18px}
    .field label{display:block;font-size:12px;font-weight:500;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .field input,.field textarea,.field select{
      width:100%;padding:10px 14px;
      border:1.5px solid var(--border);border-radius:6px;
      font-family:var(--font-body);font-size:14px;color:var(--text);
      background:var(--white);transition:border-color .2s,box-shadow .2s;outline:none;
    }
    .field input:focus,.field textarea:focus,.field select:focus{
      border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,89,105,.08);
    }
    .field textarea{resize:vertical;min-height:80px;line-height:1.5}

    .btn-primary{
      width:100%;padding:14px 24px;
      background:var(--brand);color:#fff;
      font-family:var(--font-body);font-size:15px;font-weight:500;
      border:none;border-radius:6px;cursor:pointer;
      letter-spacing:.02em;transition:background .2s var(--ease),transform .1s;
    }
    .btn-primary:hover{background:var(--brand-dark)}
    .btn-primary:active{transform:scale(.99)}

    /* ORDER SUMMARY */
    .order-col{position:sticky;top:80px}
    .summary-items{padding:20px 24px;max-height:340px;overflow-y:auto}
    .summary-item{display:flex;gap:14px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border-soft)}
    .summary-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
    .summary-img{width:56px;height:56px;border-radius:6px;object-fit:cover;border:1px solid var(--border-soft);background:var(--ivory);flex-shrink:0}
    .summary-img-placeholder{width:56px;height:56px;border-radius:6px;background:var(--ivory);border:1px solid var(--border-soft);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:10px}
    .summary-info{flex:1;min-width:0}
    .summary-name{font-size:13px;color:var(--text);line-height:1.4;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .summary-meta{font-size:12px;color:var(--text-light)}
    .summary-price{font-family:var(--font-serif);font-size:15px;color:var(--brand);white-space:nowrap;font-weight:500}

    .summary-totals{padding:16px 24px;border-top:1px solid var(--border-soft)}
    .total-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-light);margin-bottom:8px}
    .total-row.grand{font-size:17px;color:var(--text);font-weight:500;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);margin-bottom:0}
    .total-row.grand .val{font-family:var(--font-serif);color:var(--brand);font-size:19px}

    .empty-cart-msg{padding:32px 24px;text-align:center;color:var(--text-light);font-size:14px}
    .empty-cart-msg a{color:var(--brand);text-decoration:none;font-weight:500}

    .security-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-light);margin-top:14px;justify-content:center}
    .security-note svg{width:14px;height:14px;flex-shrink:0}
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo"><img src="https://wearparts.norework.in/wp-content/uploads/2023/09/Hira-1.png" alt="The Hira Store" /></a>
  <a href="cart.html" class="nav-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Cart
  </a>
</nav>

<div class="steps">
  <div class="step done">
    <div class="step-num">✓</div>
    <span>Cart</span>
  </div>
  <div class="step-div"></div>
  <div class="step active">
    <div class="step-num">2</div>
    <span>Details</span>
  </div>
  <div class="step-div"></div>
  <div class="step">
    <div class="step-num">3</div>
    <span>Payment</span>
  </div>
  <div class="step-div"></div>
  <div class="step">
    <div class="step-num">4</div>
    <span>Confirmation</span>
  </div>
</div>

<div class="page-wrap">
  <!-- FORM -->
  <div>
    <div class="card">
      <div class="card-head">
        <h2>Shipping Details</h2>
        <p>Tell us where to send your order</p>
      </div>
      <div class="card-body">
        <form id="checkoutForm" onsubmit="handleSubmit(event)">
          <div class="field-row">
            <div class="field">
              <label for="fullName">Full Name *</label>
              <input type="text" id="fullName" placeholder="Priya Sharma" required autocomplete="name"/>
            </div>
            <div class="field">
              <label for="phone">Phone *</label>
              <input type="tel" id="phone" placeholder="+91 98765 43210" required autocomplete="tel"/>
            </div>
          </div>
          <div class="field">
            <label for="email">Email Address *</label>
            <input type="email" id="email" placeholder="priya@example.com" required autocomplete="email"/>
          </div>
          <div class="field">
            <label for="address">Street Address *</label>
            <textarea id="address" placeholder="House No, Street, Area" required autocomplete="street-address"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="city">City *</label>
              <input type="text" id="city" placeholder="Mumbai" required autocomplete="address-level2"/>
            </div>
            <div class="field">
              <label for="state">State *</label>
              <input type="text" id="state" placeholder="Maharashtra" required autocomplete="address-level1"/>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="zip">PIN / ZIP Code *</label>
              <input type="text" id="zip" placeholder="400001" required autocomplete="postal-code"/>
            </div>
            <div class="field">
              <label for="country">Country</label>
              <input type="text" id="country" value="India" autocomplete="country-name"/>
            </div>
          </div>
          <div class="field">
            <label for="notes">Order Notes (optional)</label>
            <textarea id="notes" placeholder="Any special instructions..."></textarea>
          </div>

          <!-- COUPON CODE -->
          <div style="border-top:1px solid var(--border-soft);padding-top:18px;margin-top:4px;margin-bottom:20px">
            <div style="font-size:12px;font-weight:500;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Coupon Code</div>
            <div style="display:flex;gap:10px">
              <input type="text" id="couponInput" placeholder="Enter coupon code" style="flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--font-body);font-size:14px;color:var(--text);outline:none;text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"/>
              <button type="button" onclick="applyCoupon()" style="padding:10px 18px;background:var(--brand);color:#fff;border:none;border-radius:6px;font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .2s" onmouseover="this.style.background='var(--brand-dark)'" onmouseout="this.style.background='var(--brand)'">Apply</button>
            </div>
            <div id="couponMsg" style="font-size:12px;margin-top:8px;display:none"></div>
          </div>

          <button type="submit" class="btn-primary" id="continueBtn">Continue to Payment →</button>
          <p class="security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Your information is encrypted and never shared
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- ORDER SUMMARY -->
  <div class="order-col">
    <div class="card">
      <div class="card-head">
        <h2>Order Summary</h2>
        <p id="item-count-label">—</p>
      </div>
      <div class="summary-items" id="summaryItems">
        <div class="empty-cart-msg">Loading cart…</div>
      </div>
      <div class="summary-totals">
        <div class="total-row"><span>Subtotal</span><span class="val" id="subtotal">—</span></div>
        <div class="total-row"><span>Shipping</span><span>Free</span></div>
        <div class="total-row" id="discountRow" style="display:none;color:#16a34a"><span id="discountLabel">Discount</span><span class="val" id="discountVal">—</span></div>
        <div class="total-row grand"><span>Total</span><span class="val" id="grandTotal">—</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  const cart = JSON.parse(localStorage.getItem('hirastore_cart') || '[]');
  let appliedCoupon = null;
  let discountAmount = 0;

  // ─── AUTO-FILL from saved profile ──────────────────────────────────────────
  (function autoFill() {
    const saved = JSON.parse(localStorage.getItem('hs_saved_address') || '{}');
    const name  = localStorage.getItem('hs_user_name')  || '';
    const email = localStorage.getItem('hs_user_email') || '';
    if (name)          document.getElementById('fullName').value = name;
    if (email)         document.getElementById('email').value    = email;
    if (saved.address) document.getElementById('address').value  = saved.address;
    if (saved.city)    document.getElementById('city').value     = saved.city;
    if (saved.state)   document.getElementById('state').value    = saved.state;
    if (saved.zip)     document.getElementById('zip').value      = saved.zip;
    if (saved.phone)   document.getElementById('phone').value    = saved.phone;
  })();

  // ─── COUPON ────────────────────────────────────────────────────────────────
  async function applyCoupon() {
    const code  = document.getElementById('couponInput').value.trim();
    const msgEl = document.getElementById('couponMsg');
    if (!code) return;

    msgEl.style.display = 'none';
    const subtotal = cart.reduce((s, i) => s + (i.price_usd || i.price || 0) * (i.qty || 1), 0);

    try {
      const res  = await fetch('/api/coupon/validate', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ code, amount: subtotal }),
      });
      const data = await res.json();

      if (!res.ok) {
        msgEl.style.color = '#c0392b';
        msgEl.textContent = data.error || 'Invalid coupon';
        msgEl.style.display = 'block';
        appliedCoupon = null; discountAmount = 0;
        renderSummary(); return;
      }

      appliedCoupon  = data.coupon;
      discountAmount = parseFloat(data.discount) || 0;
      msgEl.style.color = '#16a34a';
      msgEl.textContent = '✓ Coupon applied! ' + (data.coupon.discount_percentage || 0) + '% off';
      msgEl.style.display = 'block';
      renderSummary();
    } catch (e) {
      msgEl.style.color = '#c0392b';
      msgEl.textContent = 'Could not validate coupon';
      msgEl.style.display = 'block';
    }
  }

  // ─── RENDER ────────────────────────────────────────────────────────────────
  function renderSummary() {
    const container = document.getElementById('summaryItems');
    if (!cart.length) {
      container.innerHTML = '<div class="empty-cart-msg">Your cart is empty. <a href="shop.html">Browse products</a></div>';
      document.getElementById('subtotal').textContent   = '$0.00';
      document.getElementById('grandTotal').textContent = '$0.00';
      document.getElementById('item-count-label').textContent = '0 items';
      return;
    }
    const subtotal = cart.reduce((s, i) => s + (i.price_usd || i.price || 0) * (i.qty || 1), 0);
    const count    = cart.reduce((s, i) => s + (i.qty || 1), 0);
    const total    = Math.max(0, subtotal - discountAmount);

    document.getElementById('item-count-label').textContent = count + ' item' + (count !== 1 ? 's' : '');
    document.getElementById('subtotal').textContent   = '$' + subtotal.toFixed(2);
    document.getElementById('grandTotal').textContent = '$' + total.toFixed(2);

    const dRow = document.getElementById('discountRow');
    if (discountAmount > 0) {
      dRow.style.display = 'flex';
      document.getElementById('discountLabel').textContent = 'Discount (' + (appliedCoupon?.coupon_code || '') + ')';
      document.getElementById('discountVal').textContent   = '-$' + discountAmount.toFixed(2);
    } else {
      dRow.style.display = 'none';
    }

    container.innerHTML = cart.map(item => {
      const price  = (item.price_usd || item.price || 0);
      const imgSrc = item.image ? (item.image.startsWith('http') ? item.image : item.image.startsWith('/') ? '/erp' + item.image : 'catalog_images/' + item.image) : '';
      return `<div class="summary-item">
        ${imgSrc ? `<img class="summary-img" src="${imgSrc}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="summary-img-placeholder" ${imgSrc ? 'style="display:none"' : ''}>IMG</div>
        <div class="summary-info">
          <div class="summary-name" title="${item.name}">${item.name}</div>
          <div class="summary-meta">Qty: ${item.qty || 1}${item.category ? ' · ' + item.category : ''}</div>
        </div>
        <div class="summary-price">$${(price * (item.qty || 1)).toFixed(2)}</div>
      </div>`;
    }).join('');
  }

  // ─── SUBMIT ────────────────────────────────────────────────────────────────
  function handleSubmit(e) {
    e.preventDefault();
    if (!cart.length) { alert('Your cart is empty.'); return; }
    const subtotal = cart.reduce((s, i) => s + (i.price_usd || i.price || 0) * (i.qty || 1), 0);
    const data = {
      fullName:   document.getElementById('fullName').value.trim(),
      phone:      document.getElementById('phone').value.trim(),
      email:      document.getElementById('email').value.trim(),
      address:    document.getElementById('address').value.trim(),
      city:       document.getElementById('city').value.trim(),
      state:      document.getElementById('state').value.trim(),
      zip:        document.getElementById('zip').value.trim(),
      country:    document.getElementById('country').value.trim(),
      notes:      document.getElementById('notes').value.trim(),
      couponCode: appliedCoupon?.coupon_code || null,
      discount:   discountAmount.toFixed(2),
      subtotal:   subtotal.toFixed(2),
      total:      Math.max(0, subtotal - discountAmount).toFixed(2),
    };
    sessionStorage.setItem('hs_checkout', JSON.stringify(data));
    window.location.href = 'payment.html';
  }

  renderSummary();
</script>
</body>
</html>
